<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國泰蒔萃 - 名單管理系統</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f0ebe3;
    --bg2: #e8e0d5;
    --bg3: #ddd5c8;
    --border: rgba(139,115,85,0.15);
    --border2: rgba(139,115,85,0.25);
    --accent: #8b6340;
    --accent2: #a67850;
    --text: #2c2318;
    --text2: #7a6550;
    --text3: #b0a090;
    --success: #5a8f6a;
    --warn: #c47e2a;
    --danger: #b84040;
    --info: #4a7aaa;
    --purple: #7a5faa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Noto Sans TC', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
    line-height: 1.6;
  }

  /* HEADER */
  header {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
    height: 56px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 16px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 1px;
  }
  .logo-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; }
  .header-right { display: flex; align-items: center; gap: 12px; }
  .sync-status {
    font-size: 12px;
    color: var(--text2);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .sync-dot {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--success);
    animation: pulse 2s infinite;
  }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }

  /* STATS BAR */
  .stats-bar {
    background: var(--bg2);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    gap: 24px;
    overflow-x: auto;
  }
  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    min-width: 80px;
  }
  .stat-num { font-size: 20px; font-weight: 600; }
  .stat-label { font-size: 11px; color: var(--text2); margin-top: 2px; white-space: nowrap; }

  /* TOOLBAR */
  .toolbar {
    padding: 14px 24px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
    background: var(--bg);
    border-bottom: 1px solid var(--border);
  }
  .search-box {
    flex: 1;
    min-width: 200px;
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 12px;
    color: var(--text);
    font-size: 13px;
    outline: none;
    transition: border-color .2s;
    font-family: inherit;
  }
  .search-box:focus { border-color: var(--accent); }
  .search-box::placeholder { color: var(--text3); }
  select.filter {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 7px 10px;
    color: var(--text);
    font-size: 13px;
    outline: none;
    cursor: pointer;
    font-family: inherit;
    transition: border-color .2s;
  }
  select.filter:focus { border-color: var(--accent); }
  .btn {
    padding: 7px 16px;
    border-radius: 6px;
    border: 1px solid var(--border2);
    background: transparent;
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    font-family: inherit;
    transition: all .2s;
    white-space: nowrap;
  }
  .btn:hover { background: var(--bg3); border-color: var(--accent); color: var(--accent); }
  .btn-primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #faf6f0;
    font-weight: 600;
  }
  .btn-primary:hover { background: var(--accent2); border-color: var(--accent2); color: #faf6f0; }

  /* TABLE */
  .table-wrap {
    overflow-x: auto;
    padding: 0 24px 24px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    min-width: 900px;
  }
  thead th {
    text-align: left;
    padding: 10px 12px;
    font-size: 11px;
    font-weight: 500;
    color: var(--text2);
    text-transform: uppercase;
    letter-spacing: .8px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
    white-space: nowrap;
    cursor: pointer;
    user-select: none;
  }
  thead th:hover { color: var(--accent); }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background .15s;
    cursor: pointer;
  }
  tbody tr:hover { background: var(--bg3); }
  tbody td {
    padding: 10px 12px;
    font-size: 13px;
    vertical-align: middle;
    max-width: 200px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  td.notes-col {
    max-width: 220px;
    color: var(--text2);
    font-size: 12px;
  }

  /* STATUS BADGES */
  .badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
  }
  .badge-待確認 { background: rgba(92,155,213,.15); color: #5b9bd5; border: 1px solid rgba(92,155,213,.25); }
  .badge-未接 { background: rgba(224,152,64,.15); color: #e09840; border: 1px solid rgba(224,152,64,.25); }
  .badge-已來訪 { background: rgba(76,175,136,.15); color: #4caf88; border: 1px solid rgba(76,175,136,.25); }
  .badge-已預約 { background: rgba(139,111,212,.15); color: #8b6fd4; border: 1px solid rgba(139,111,212,.25); }
  .badge-無需求 { background: rgba(224,92,92,.15); color: #e05c5c; border: 1px solid rgba(224,92,92,.25); }
  .badge-空號 { background: rgba(92,90,86,.15); color: var(--text3); border: 1px solid rgba(92,90,86,.25); }
  .badge-default { background: rgba(255,255,255,.06); color: var(--text2); border: 1px solid var(--border); }

  /* MODAL */
  .modal-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.7);
    z-index: 200;
    align-items: center;
    justify-content: center;
    backdrop-filter: blur(2px);
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: #ede6dc;
    border: 1px solid rgba(139,115,85,0.3);
    border-radius: 12px;
    width: 520px;
    max-width: 95vw;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-header {
    padding: 20px 24px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .modal-title { font-size: 16px; font-weight: 600; color: var(--accent); }
  .modal-close {
    background: none;
    border: none;
    color: var(--text2);
    font-size: 20px;
    cursor: pointer;
    line-height: 1;
    padding: 2px 6px;
  }
  .modal-close:hover { color: var(--text); }
  .modal-body { padding: 20px 24px; }
  .form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .form-group {
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .form-group.full { grid-column: 1 / -1; }
  .form-label { font-size: 11px; color: var(--text2); font-weight: 500; letter-spacing: .5px; }
  .form-input, .form-select, .form-textarea {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    color: var(--text);
    font-size: 13px;
    outline: none;
    font-family: inherit;
    transition: border-color .2s;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-textarea { resize: vertical; min-height: 70px; }
  option { background: var(--bg2); }
  .modal-footer {
    padding: 14px 24px 20px;
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    border-top: 1px solid var(--border);
  }
  .btn-danger { background: rgba(224,92,92,.15); border-color: var(--danger); color: var(--danger); }
  .btn-danger:hover { background: var(--danger); color: #fff; }

  /* EMPTY */
  .empty-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--text3);
  }
  .empty-icon { font-size: 36px; margin-bottom: 12px; }

  /* TOAST */
  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    background: #ddd5c8;
    border: 1px solid rgba(139,115,85,0.3);
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 13px;
    color: var(--text);
    z-index: 500;
    transform: translateY(80px);
    opacity: 0;
    transition: all .3s ease;
    max-width: 300px;
  }
  .toast.show { transform: translateY(0); opacity: 1; }
  .toast.success { border-left: 3px solid var(--success); }
  .toast.error { border-left: 3px solid var(--danger); }

  /* LOADING */
  #loading-overlay {
    position: fixed;
    inset: 0;
    background: #f0ebe3;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
    flex-direction: column;
    gap: 16px;
  }
  .spinner {
    width: 36px; height: 36px;
    border: 2px solid rgba(139,115,85,0.25);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin .8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-text { color: var(--text2); font-size: 13px; }

  /* PAGINATION */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 12px 24px;
    border-top: 1px solid var(--border);
    font-size: 12px;
    color: var(--text2);
  }
  .page-btns { display: flex; gap: 6px; }
  .page-btn {
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text2);
    font-size: 12px;
    cursor: pointer;
    font-family: inherit;
  }
  .page-btn:hover { border-color: var(--accent); color: var(--accent); }
  .page-btn.active { background: var(--accent); border-color: var(--accent); color: #faf6f0; font-weight: 600; }
  .page-btn:disabled { opacity: .3; cursor: default; }

  @media (max-width: 600px) {
    .stats-bar { gap: 16px; }
    .form-grid { grid-template-columns: 1fr; }
    .toolbar { gap: 8px; }
  }
</style>
</head>
<body>

</div>

<div class="stats-bar" id="stats-bar">

<div class="toolbar">

  <select class="filter" id="f-media" onchange="renderTable()">

  </select>
  <select class="filter" id="f-year-filter" onchange="renderTable()">

  </select>
  <select class="filter" id="f-date" onchange="renderTable()">

    <div class="modal-footer">
      <button class="btn btn-danger" id="btn-delete" onclick="deleteRecord()" style="display:none;margin-right:auto">刪除</button>
      <button class="btn" onclick="closeModal()">取消</button>
      <button class="btn btn-primary" onclick="saveRecord()">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbz59t8cGnTBH-Kb4t6NuSjv8OO53MjRuw360C7IrkrCbxMxe1813fo8QRLyD43A-_kozw/exec';
let records = [];
let editingId = null;
let sortCol = 'date';
let sortAsc = false;
let page = 1;
const PAGE_SIZE = 50;

// ─── GOOGLE SHEETS API ───
async function loadData() {
  setSyncStatus('loading');
  try {
    const res = await fetch(API_URL);
    const json = await res.json();
    if (json.ok) {
      records = json.data.filter(r => r.name);
      setSyncStatus('ok');
    } else {
      throw new Error('API error');
    }
  } catch(e) {
    setSyncStatus('error');
    showToast('無法連線到 Google Sheets，請確認網路', 'error');
    records = [];
  }
}

async function apiCall(action, record) {
  setSyncStatus('loading');
  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      body: JSON.stringify({ action, record })
    });
    const json = await res.json();
    setSyncStatus('ok');
    return json;
  } catch(e) {
    setSyncStatus('error');
    showToast('儲存失敗，請確認網路連線', 'error');
    return null;
  }
}

function setSyncStatus(state) {
  const dot = document.getElementById('sync-dot');
  const label = document.getElementById('sync-label');
  if (state === 'ok') {
    dot.style.background = 'var(--success)';
    label.textContent = 'Google Sheets 同步中';
  } else if (state === 'loading') {
    dot.style.background = 'var(--warn)';
    label.textContent = '同步中…';
  } else {
    dot.style.background = 'var(--danger)';
    label.textContent = '連線失敗';
  }
}

// ─── FILTER & SORT ───
function getFiltered() {
  const q = document.getElementById('search').value.toLowerCase();
  const fStatus = document.getElementById('f-status').value;
  const fAgent = document.getElementById('f-agent').value;
  const fMedia = document.getElementById('f-media').value;
  const fDate = document.getElementById('f-date').value;
  const fYear = document.getElementById('f-year-filter').value;

  return records.filter(r => {
    if (q && !`${r.name}${r.phone}${r.notes}${r.region}${r.agent}`.toLowerCase().includes(q)) return false;
    if (fStatus && r.status !== fStatus) return false;
    if (fAgent && r.agent !== fAgent) return false;
    if (fMedia && r.media !== fMedia) return false;
    if (fDate && r.date !== fDate) return false;
    if (fYear && r.year !== fYear) return false;
    return true;
  }).sort((a, b) => {
    let av = a[sortCol] || '', bv = b[sortCol] || '';
    if (sortCol === 'date') {
      // Sort by year then date numerically
      const ya = parseInt(a.year||0), yb = parseInt(b.year||0);
      if (ya !== yb) return sortAsc ? ya - yb : yb - ya;
      const [am=0,ad=0] = (a.date||'').split('/').map(Number);
      const [bm=0,bd=0] = (b.date||'').split('/').map(Number);
      const da = am*100+ad, db = bm*100+bd;
      return sortAsc ? da - db : db - da;
    }
    return sortAsc ? av.localeCompare(bv,'zh-TW') : bv.localeCompare(av,'zh-TW');
  });
}

function sortBy(col) {
  if (sortCol === col) sortAsc = !sortAsc;
  else { sortCol = col; sortAsc = false; }
  page = 1;
  renderTable();
}

function clearFilters() {
  document.getElementById('search').value = '';
  document.getElementById('f-status').value = '';
  document.getElementById('f-agent').value = '';
  document.getElementById('f-media').value = '';
  document.getElementById('f-date').value = '';
  document.getElementById('f-year-filter').value = '';
  page = 1;
  renderTable();
}

// ─── RENDER ───
function renderTable() {
  const filtered = getFiltered();
  const total = filtered.length;
  const totalPages = Math.ceil(total / PAGE_SIZE) || 1;
  if (page > totalPages) page = totalPages;
  const slice = filtered.slice((page-1)*PAGE_SIZE, page*PAGE_SIZE);

  // Stats
  document.getElementById('s-total').textContent = records.length;
  document.getElementById('s-visited').textContent = records.filter(r=>r.status==='已來訪').length;
  document.getElementById('s-reserved').textContent = records.filter(r=>r.status==='已預約').length;
  document.getElementById('s-pending').textContent = records.filter(r=>r.status==='待確認').length;
  document.getElementById('s-missed').textContent = records.filter(r=>r.status==='未接').length;
  document.getElementById('s-no-need').textContent = records.filter(r=>r.status==='無需求').length;

  // Weekly stats
  function getWeekRange(offset) {
    const now = new Date(2026, 4, 9); // 2026/5/9
    const day = now.getDay() || 7;
    const mon = new Date(now); mon.setDate(now.getDate() - day + 1 + offset*7);
    const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
    return { mon, sun };
  }
  function inRange(r, mon, sun) {
    const parts = (r.date||'').split('/');
    if (parts.length < 2) return false;
    const yr = parseInt(r.year) || 2025;
    const d = new Date(yr, parseInt(parts[0])-1, parseInt(parts[1]));
    return d >= mon && d <= sun;
  }
  const thisWeek = getWeekRange(0);
  const lastWeek = getWeekRange(-1);
  document.getElementById('s-week').textContent = records.filter(r => inRange(r, thisWeek.mon, thisWeek.sun)).length;
  document.getElementById('s-lastweek').textContent = records.filter(r => inRange(r, lastWeek.mon, lastWeek.sun)).length;

  // Dropdowns
  populateFilters();

  // Table
  const tbody = document.getElementById('tbody');
  if (slice.length === 0) {
    tbody.innerHTML = '';
    document.getElementById('empty-state').style.display = 'block';
  } else {
    document.getElementById('empty-state').style.display = 'none';
    tbody.innerHTML = slice.map(r => `
      <tr onclick="openModal('${r.id}')">
        <td style="color:var(--text3);font-size:12px">${r.year || '—'}</td>
        <td style="color:var(--text2);font-size:12px">${r.date || '—'}</td>
        <td style="font-weight:500">${esc(r.name)}</td>
        <td style="font-family:monospace;color:var(--text2)">${esc(r.phone)}</td>
        <td style="color:var(--text2)">${esc(r.region)}</td>
        <td>${badgeHtml(r.status)}</td>
        <td style="color:var(--text2)">${esc(r.media)}</td>
        <td style="color:var(--text2)">${esc(r.agent)}</td>
        <td style="color:var(--text2);font-size:12px">${esc(r.dispatch)}</td>
        <td class="notes-col" title="${esc(r.notes)}">${esc(r.notes)}</td>
        <td style="width:24px;text-align:center;color:var(--text3);font-size:16px">›</td>
      </tr>
    `).join('');
  }

  // Pagination
  document.getElementById('page-info').textContent = `共 ${total} 筆，第 ${page}/${totalPages} 頁`;
  const pbDiv = document.getElementById('page-btns');
  let btns = '';
  btns += `<button class="page-btn" onclick="changePage(${page-1})" ${page<=1?'disabled':''}>‹</button>`;
  for (let i = Math.max(1,page-2); i <= Math.min(totalPages,page+2); i++) {
    btns += `<button class="page-btn ${i===page?'active':''}" onclick="changePage(${i})">${i}</button>`;
  }
  btns += `<button class="page-btn" onclick="changePage(${page+1})" ${page>=totalPages?'disabled':''}>›</button>`;
  pbDiv.innerHTML = btns;

  // Sort indicators
  ['year','date','name','phone','region','status','media','agent','dispatch'].forEach(c => {
    const el = document.getElementById('sort-'+c);
    if (el) el.textContent = sortCol===c ? (sortAsc?'↑':'↓') : '';
  });
}

function changePage(p) {
  const filtered = getFiltered();
  const totalPages = Math.ceil(filtered.length / PAGE_SIZE) || 1;
  page = Math.max(1, Math.min(p, totalPages));
  renderTable();
}

function populateFilters() {
  const agents = [...new Set(records.map(r=>r.agent).filter(Boolean))].sort();
  const medias = [...new Set(records.map(r=>r.media).filter(Boolean))].sort();
  const dates = [...new Set(records.map(r => r.year + '|' + r.date).filter(r => r.includes('/')))].sort((a,b) => {
    const [ay,ad] = a.split('|'); const [by,bd] = b.split('|');
    const [am,adm] = (ad||'').split('/').map(Number); const [bm,bdm] = (bd||'').split('/').map(Number);
    return (parseInt(by)||0)*10000+(bm||0)*100+(bdm||0) - ((parseInt(ay)||0)*10000+(am||0)*100+(adm||0));
  }).map(x => x.split('|')[1]);
  const regions = [...new Set(records.map(r=>r.region).filter(Boolean))].sort();

  const years = [...new Set(records.map(r=>r.year).filter(Boolean))].sort().reverse();
  const fyEl = document.getElementById('f-year-filter');
  const curY = fyEl.value;
  fyEl.innerHTML = '<option value="">全部年份</option>' + years.map(y=>`<option ${y===curY?'selected':''}>${y}</option>`).join('');

  const fa = document.getElementById('f-agent');
  const curA = fa.value;
  fa.innerHTML = '<option value="">全部業務</option>' + agents.map(a=>`<option ${a===curA?'selected':''}>${a}</option>`).join('');

  const fm = document.getElementById('f-media');
  const curM = fm.value;
  fm.innerHTML = '<option value="">全部媒體</option>' + medias.map(m=>`<option ${m===curM?'selected':''}>${m}</option>`).join('');

  const fd = document.getElementById('f-date');
  const curD = fd.value;
  fd.innerHTML = '<option value="">全部日期</option>' + dates.map(d=>`<option ${d===curD?'selected':''}>${d}</option>`).join('');

  // Datalists in modal
  document.getElementById('agent-list').innerHTML = agents.map(a=>`<option value="${a}">`).join('');
  document.getElementById('media-list').innerHTML = medias.map(m=>`<option value="${m}">`).join('');
  document.getElementById('region-list').innerHTML = regions.map(r=>`<option value="${r}">`).join('');
}

function badgeHtml(status) {
  const cls = ['待確認','未接','已來訪','已預約','無需求','空號'].includes(status) ? 'badge-'+status : 'badge-default';
  return `<span class="badge ${cls}">${esc(status)||'—'}</span>`;
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ─── MODAL ───
function openModal(id) {
  editingId = id || null;
  const modal = document.getElementById('modal');
  const del = document.getElementById('btn-delete');

  if (id) {
    const r = records.find(x=>x.id===id);
    if (!r) return;
    document.getElementById('modal-title').textContent = '編輯聯絡人';
    document.getElementById('f-year').value = r.year || '';
    document.getElementById('f-date-input').value = r.date || '';
    document.getElementById('f-name').value = r.name || '';
    document.getElementById('f-phone').value = r.phone || '';
    document.getElementById('f-region').value = r.region || '';
    document.getElementById('f-contact-status').value = r.status || '';
    document.getElementById('f-media-input').value = r.media || '';
    document.getElementById('f-agent-input').value = r.agent || '';
    document.getElementById('f-dispatch').value = r.dispatch || '';
    document.getElementById('f-notes').value = r.notes || '';
    del.style.display = '';
  } else {
    document.getElementById('modal-title').textContent = '新增聯絡人';
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('f-year').value = new Date().getFullYear();
    document.getElementById('f-date-input').value = '';
    document.getElementById('f-name').value = '';
    document.getElementById('f-phone').value = '';
    document.getElementById('f-region').value = '臺中市';
    document.getElementById('f-contact-status').value = '待確認';
    document.getElementById('f-media-input').value = '官網';
    document.getElementById('f-agent-input').value = '';
    document.getElementById('f-dispatch').value = today;
    document.getElementById('f-notes').value = '';
    del.style.display = 'none';
  }
  modal.classList.add('open');
  document.getElementById('f-name').focus();
}

function closeModal() {
  document.getElementById('modal').classList.remove('open');
  editingId = null;
}

async function saveRecord() {
  const name = document.getElementById('f-name').value.trim();
  const phone = document.getElementById('f-phone').value.trim();
  if (!name) { showToast('請填入姓名', 'error'); return; }

  const rec = {
    id: editingId || ('r_' + Date.now() + '_' + Math.random().toString(36).slice(2,6)),
    year: document.getElementById('f-year').value,
    date: document.getElementById('f-date-input').value,
    name,
    phone,
    region: document.getElementById('f-region').value.trim(),
    status: document.getElementById('f-contact-status').value,
    media: document.getElementById('f-media-input').value.trim(),
    agent: document.getElementById('f-agent-input').value.trim(),
    dispatch: document.getElementById('f-dispatch').value,
    notes: document.getElementById('f-notes').value.trim(),
  };

  const action = editingId ? 'update' : 'add';

  // Optimistic update
  if (editingId) {
    const idx = records.findIndex(r=>r.id===editingId);
    if (idx >= 0) records[idx] = rec;
  } else {
    records.unshift(rec);
  }
  closeModal();
  renderTable();
  showToast('儲存中…');

  const result = await apiCall(action, rec);
  if (result && result.ok) {
    showToast(editingId ? '已更新並同步到 Google Sheets ✓' : '已新增並同步到 Google Sheets ✓', 'success');
  }
}

async function deleteRecord() {
  if (!editingId) return;
  if (!confirm('確認刪除此筆資料？')) return;
  const rec = records.find(r=>r.id===editingId);
  records = records.filter(r=>r.id!==editingId);
  closeModal();
  renderTable();
  showToast('刪除中…');
  const result = await apiCall('delete', rec);
  if (result && result.ok) {
    showToast('已刪除並同步到 Google Sheets ✓', 'success');
  }
}

// ─── EXPORT ───
function exportCSV() {
  const filtered = getFiltered();
  const headers = ['日期','姓名','電話','區域','聯絡狀況','媒體','跑單','派發日','詳細狀況'];
  const rows = filtered.map(r => [
    r.date,r.name,r.phone,r.region,r.status,r.media,r.agent,r.dispatch,r.notes
  ].map(v => `"${(v||'').replace(/"/g,'""')}"`));
  const csv = '\uFEFF' + [headers, ...rows].map(r=>r.join(',')).join('\n');
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = '名單_' + new Date().toLocaleDateString('zh-TW').replace(/\//g,'-') + '.csv';
  a.click();
  showToast('CSV 已匯出', 'success');
}

// ─── TOAST ───
function showToast(msg, type='success') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
}

// ─── INIT ───
window.addEventListener('DOMContentLoaded', async () => {
  setSyncStatus('loading');
  await loadData();
  renderTable();
  document.getElementById('loading-overlay').style.display = 'none';
  showToast('名單已載入，共 ' + records.length + ' 筆', 'success');
  // 每3分鐘自動刷新
  setInterval(async () => {
    await loadData();
    renderTable();
    showToast('資料已自動更新 ↻', 'success');
  }, 3 * 60 * 1000);
});

// Keyboard shortcut
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
  if ((e.metaKey||e.ctrlKey) && e.key==='n') { e.preventDefault(); openModal(); }
});
